name: Release skill zip

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check scripts compile
        run: python -m py_compile skills/job-hunt-autopilot/scripts/*.py tools/package.py
      - name: Build zip
        run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: job-hunt-autopilot
          path: dist/job-hunt-autopilot.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/job-hunt-autopilot.zip
          generate_release_notes: true
